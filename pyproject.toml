[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pylens"
version = "0.1.0"
description = "Run Python scripts with resource monitoring and local history"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["psutil>=5.9"]

[project.scripts]
pylens = "pylens.interface:main"
pylens-menu = "pylens.interface.interactive:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pylens = ["database/*.sql"]
